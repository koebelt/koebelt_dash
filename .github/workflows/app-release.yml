# Builds koebelt dash for every platform. A tag app-vX.Y.Z (matching the
# version in apps/dash/pubspec.yaml) publishes it: macOS (signed, notarized
# .dmg), Windows (installer), Linux (tarball) and Android (APK) on a GitHub
# Release, and iOS to TestFlight. Run by hand (Actions > app-release > Run
# workflow) it only builds, unsigned where the secrets are missing, and keeps
# the files as workflow artifacts. Setup: tools/release/RELEASING.md.
name: app-release
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/app-v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # A release without the Mapbox token would ship without map tiles.
      - name: Mapbox token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ "$PUBLISH" = true ] && [ -z "$MAPBOX_TOKEN" ]; then
            echo "The repository secret MAPBOX_TOKEN is missing (tools/release/RELEASING.md)" >&2; exit 1
          fi
      - id: v
        # The version is appVersion (lib/link/protocol.dart), with an optional
        # pre-release: 1.3.0-beta.1. The pubspec keeps the numbers only, as
        # iOS and macOS want them (1.3.0), and Python writes it 1.3.0b1.
        run: |
          v=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" apps/dash/lib/link/protocol.dart)
          base=${v%%-*}
          if [ "$PUBLISH" = true ] && [ "${GITHUB_REF_NAME#app-v}" != "$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appVersion $v" >&2; exit 1
          fi
          grep -q "^version: $base+" apps/dash/pubspec.yaml || { echo "apps/dash/pubspec.yaml is not $base" >&2; exit 1; }
          py=$(echo "$v" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
          # koebelt-dash-scripts and the MCP bridge are released with the app, at its version.
          grep -q "^version = \"$py\"" libs/python-dash-scripts/pyproject.toml || { echo "libs/python-dash-scripts/pyproject.toml is not $py" >&2; exit 1; }
          grep -q "^__version__ = \"$py\"" libs/python-dash-scripts/koebelt_dash_scripts/__init__.py || { echo "koebelt_dash_scripts.__version__ is not $py" >&2; exit 1; }
          grep -q "^const version = '$v';" tools/mcp_bridge/bin/koebelt_dash_mcp.dart || { echo "the MCP bridge's version is not $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [ "$v" != "$base" ] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  # The Python package scripts import, on PyPI (trusted publishing: a
  # publisher for this workflow and the pypi environment, set up once).
  pypi-scripts:
    needs: version
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults: { run: { working-directory: libs/python-dash-scripts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" build && pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: libs/python-dash-scripts/dist }

  macos:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
      HAS_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.2 }
      # The libserialport pod builds from source with autotools.
      - run: brew install automake libtool
      - run: flutter build macos --release --build-number=${{ needs.version.outputs.build }} --dart-define=KDASH_UPDATES=github --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
        working-directory: apps/dash
      # The MCP bridge for clients that start a command (Claude Desktop), next to the app's executable.
      - name: MCP bridge
        run: |
          cd tools/mcp_bridge && dart pub get
          dart compile exe bin/koebelt_dash_mcp.dart -o "../../apps/dash/build/macos/Build/Products/Release/koebelt dash.app/Contents/MacOS/koebelt-dash-mcp"
      - name: Signing keychain
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: tools/release/ci_keychain.sh
      - name: dmgbuild (lays out the disk image window)
        run: python3 -m venv "$RUNNER_TEMP/dmgbuild" && "$RUNNER_TEMP/dmgbuild/bin/pip" install -q dmgbuild && echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Sign, notarize and package
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ "$PUBLISH" = true ] && [ -z "$MAC_SIGN_IDENTITY" ] && { echo "No Developer ID secret" >&2; exit 1; }
          tools/release/macos_dmg.sh "apps/dash/build/macos/Build/Products/Release/koebelt dash.app" "koebelt-dash-$V-macos.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "koebelt-dash-*-macos.dmg" }

  ios:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
      HAS_SIGNING: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.2 }
      - name: Build without signing (no secrets)
        if: env.HAS_SIGNING != 'true'
        run: |
          [ "$PUBLISH" = true ] && { echo "No App Store signing secrets" >&2; exit 1; }
          flutter build ios --release --no-codesign --build-number=${{ needs.version.outputs.build }} --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
        working-directory: apps/dash
      - name: Signing keychain and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          tools/release/ci_keychain.sh
          for d in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d" && echo "$PROFILE_BASE64" | base64 --decode > "$d/koebelt-dash-app-store.mobileprovision"
          done
          cat > apps/dash/ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = koebelt dash App Store
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.koebelt.dash</key><string>koebelt dash App Store</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
      - name: Build the .ipa
        if: env.HAS_SIGNING == 'true'
        run: flutter build ipa --release --build-number=${{ needs.version.outputs.build }} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
        working-directory: apps/dash
      # App Store Connect's checks, without uploading: a build-only run finds
      # what it would refuse (unsigned code, a .py inside the app…) before a tag.
      - name: Validate with App Store Connect
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --validate-app --type ios --file apps/dash/build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && env.PUBLISH == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file apps/dash/build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.2 }
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            [ "$PUBLISH" = true ] && { echo "No Android upload key secret" >&2; exit 1; }
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: apps/dash
        run: |
          flutter build apk --release --build-number=${{ needs.version.outputs.build }} --dart-define=KDASH_UPDATES=github --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          flutter build appbundle --release --build-number=${{ needs.version.outputs.build }} --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          mv build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/koebelt-dash-$V-android.apk"
          mv build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/koebelt-dash-$V-android.aab"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "koebelt-dash-*-android.a*" }

  windows:
    needs: version
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.2 }
      - run: flutter build windows --release --build-number=${{ needs.version.outputs.build }} --dart-define=KDASH_UPDATES=github --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
        working-directory: apps/dash
      - name: MCP bridge
        run: |
          cd tools/mcp_bridge && dart pub get
          dart compile exe bin/koebelt_dash_mcp.dart -o ../../apps/dash/build/windows/x64/runner/Release/koebelt-dash-mcp.exe
          ../../apps/dash/build/windows/x64/runner/Release/koebelt-dash-mcp.exe --version
      - name: Installer
        run: |
          choco install innosetup --no-progress -y >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$V" "-DSource=$GITHUB_WORKSPACE\\apps\\dash\\build\\windows\\x64\\runner\\Release" "-DOutput=$GITHUB_WORKSPACE" tools/release/windows/koebelt-dash.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "koebelt-dash-*-windows-x64-setup.exe" }

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.2 }
      - run: flutter build linux --release --build-number=${{ needs.version.outputs.build }} --dart-define=KDASH_UPDATES=github --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
        working-directory: apps/dash
      - name: MCP bridge
        run: |
          cd tools/mcp_bridge && dart pub get
          dart compile exe bin/koebelt_dash_mcp.dart -o ../../apps/dash/build/linux/x64/release/bundle/koebelt-dash-mcp
          ../../apps/dash/build/linux/x64/release/bundle/koebelt-dash-mcp --version
      - name: Tarball
        run: |
          d=koebelt-dash-$V-linux-x64
          cp -r apps/dash/build/linux/x64/release/bundle "$d"
          cp tools/release/linux/* LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "koebelt-dash-*-linux-x64.tar.gz" }

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [version, macos, ios, android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: |
          notes=tools/release/app-notes/$V.md
          [ -f "$notes" ] || notes=/dev/null
          # The app checks every update it downloads against this list.
          (cd dist && sha256sum *.dmg *.exe *.apk *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # Which koebelt/link versions this release works with: installed apps
          # read it before updating (apps/dash/lib/core/compat.dart).
          cp apps/dash/compat.json dist/compat.json
          # Betas are pre-releases: only apps that opted into betas are offered them.
          pre=; [ "${{ needs.version.outputs.prerelease }}" = true ] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" $pre --title "koebelt dash $V" --notes-file "$notes" \
            dist/*.dmg dist/*.exe dist/*.apk dist/*.tar.gz dist/SHA256SUMS dist/compat.json
