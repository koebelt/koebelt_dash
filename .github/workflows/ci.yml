name: ci
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/dash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Rust guide examples build with the `ble` feature (BlueZ needs D-Bus headers)
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: python -m venv ../../libs/python/.venv && ../../libs/python/.venv/bin/pip install -e "../../libs/python[dev]" pymavlink
      # Scripts: dash runs Python with koebelt-dash-scripts (test/script_run_test.dart).
      - run: python -m venv ../../libs/python-dash-scripts/.venv && ../../libs/python-dash-scripts/.venv/bin/pip install -e "../../libs/python-dash-scripts[dev]"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: MCP bridge
        working-directory: tools/mcp_bridge
        run: dart pub get && dart analyze && dart test

  # The app against every published koebelt/link release (PyPI, crates.io):
  # devices people already run must keep working with each new app.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/compat/run.sh

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: libs/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q
      - run: PYTHONPATH=../ros2/koebelt_link_ros pytest -q ../ros2/koebelt_link_ros/test

  # koebelt-dash-scripts, on the oldest and newest Python and websockets it supports.
  python-dash-scripts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: libs/python-dash-scripts } }
    strategy:
      matrix:
        include:
          - { python: "3.9", websockets: "websockets==12.0" }
          - { python: "3.13", websockets: "websockets" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" "${{ matrix.websockets }}" && pytest -q

  arduino-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C libs/arduino/KoebeltLink/test

  arduino-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: libs/arduino/KoebeltLink
            - name: ArduinoJson
            - name: ESP32Servo
            - name: NimBLE-Arduino
          # The other examples need a board without built-in Wi-Fi.
          sketch-paths: |
            - libs/arduino/KoebeltLink/examples/Quickstart
            - libs/arduino/KoebeltLink/examples/SerialRover
            - libs/arduino/KoebeltLink/examples/ThrustBench
            - libs/arduino/KoebeltLink/examples/RadioRover
            - libs/arduino/KoebeltLink/examples/CameraRover
            - libs/arduino/KoebeltLink/examples/BluetoothModule
            - libs/arduino/KoebeltLink/examples/NimBLE
      # Wi-Fi and Bluedroid together need the Huge APP partition (see the sketch).
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: libs/arduino/KoebeltLink
            - name: ArduinoJson
          sketch-paths: |
            - libs/arduino/KoebeltLink/examples/AnyBoard

  arduino-boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:samd:arduino_zero_native
            platforms: |
              - name: arduino:samd
            libraries: |
              - name: Ethernet
              - name: WiFiEspAT
            sketches: |
              - libs/arduino/KoebeltLink/examples/EthernetW5500
              - libs/arduino/KoebeltLink/examples/EspAtCoprocessor
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: adafruit:nrf52:feather52840
            platforms: |
              - name: adafruit:nrf52
                source-url: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
            libraries: ""
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            libraries: ""
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/SerialRover
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: rp2040:rp2040:rpipicow
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: ""
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/SerialRover
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - name: ArduinoBLE
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/SerialRover
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: arduino:samd:nano_33_iot
            platforms: |
              - name: arduino:samd
            libraries: |
              - name: WiFiNINA
              - name: ArduinoBLE
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/SerialRover
              - libs/arduino/KoebeltLink/examples/BluetoothModule
          - fqbn: arduino:mbed_nano:nano33ble
            platforms: |
              - name: arduino:mbed_nano
            libraries: |
              - name: ArduinoBLE
            sketches: |
              - libs/arduino/KoebeltLink/examples/AnyBoard
              - libs/arduino/KoebeltLink/examples/SerialRover
              - libs/arduino/KoebeltLink/examples/BluetoothModule
    steps:
      - uses: actions/checkout@v4
      # The Adafruit nRF52 core packages its build with adafruit-nrfutil.
      - if: contains(matrix.fqbn, 'nrf52')
        run: pip install adafruit-nrfutil
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: |
            - source-path: libs/arduino/KoebeltLink
            - name: ArduinoJson
            ${{ matrix.libraries }}
          sketch-paths: |
            ${{ matrix.sketches }}

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: libs/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: thumbv7em-none-eabihf }
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --features ble
      - run: cargo clippy --all-targets --features ble -- -D warnings
      - run: cargo build --no-default-features --features embassy --target thumbv7em-none-eabihf
