[package]
name = "koebelt-link"
version = "1.5.0"
edition = "2024"
description = "Connect drones, robots and test rigs to the koebelt dash app (KoebeltLink protocol)."
authors = ["Thomas Koebel <contact@koebelt.com>"]
license = "MIT"
repository = "https://github.com/koebelt/koebelt_dash"
keywords = ["robotics", "drone", "telemetry", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

# No dependencies: the protocol core is no_std and allocation-free.
[dependencies]

[features]
default = ["std"]
std = []
# no_std build for embassy / embedded-hal targets: implement `Transport` for your stack.
embassy = []
