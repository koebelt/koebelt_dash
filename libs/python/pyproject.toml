[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koebelt-link"
version = "1.0.0"
description = "Connect drones, robots and test rigs to the koebelt/dash app."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Koebel", email = "contact@koebelt.com" }]
keywords = ["robotics", "drone", "rover", "telemetry", "raspberry-pi", "koebelt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/koebelt/koebelt_dash"
Source = "https://github.com/koebelt/koebelt_dash/tree/main/libs/python"
Protocol = "https://github.com/koebelt/koebelt_dash/blob/main/protocol/PROTOCOL.md"
Issues = "https://github.com/koebelt/koebelt_dash/issues"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bless>=0.2.6"]
camera = ["opencv-python-headless>=4.5"]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
koebelt-link-sim = "koebelt_link.sim:main"

[tool.setuptools]
packages = ["koebelt_link"]

[tool.setuptools.package-data]
koebelt_link = ["py.typed"]
